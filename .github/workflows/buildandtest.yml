# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Test

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    # Live-database (unit-of-work) tests skip themselves (Inconclusive) unless
    # ECENI_TEST_MYSQL_CONNECTION_STRING is set, so this runs safely with no database service in CI.
    - name: Test
      run: dotnet test tests/Eceni.Core.UnitTest --no-build --verbosity normal
